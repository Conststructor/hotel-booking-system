server:
  port: 8082

spring:
  application:
    name: hotel-management-service

  datasource:
    url: jdbc:h2:mem:hotel-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# JWT конфигурация
jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWT12345678901234567890}
  issuer: hotel-management-service
  expiration: 3600

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.hotel.management.service: INFO

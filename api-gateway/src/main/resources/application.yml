server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway

  cloud:
    gateway:
      # Маршрутизация на микросервисы через Eureka
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      routes:
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**, /api/user/**, /api/auth/**, /api/register/**
          
        - id: hotel-management-service
          uri: lb://hotel-management-service
          predicates:
            - Path=/api/hotels/**, /api/rooms/**

      # Настройки фильтрации JWT токена
      globalFilters:
        - name: JwtRelayFilter
          order: -100
          filters:
            - NamePrefix=Authorization,Bearer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include:
          - gateway
          - health
          - info
  endpoint:
    gateway:
      path: /actuator/gateway
    health:
      path: /actuator/health

# Настройки JWT для проксирования
jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWT12345678901234567890}
  issuer: api-gateway
  expiration: 3600

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.hotel.gateway: DEBUG
